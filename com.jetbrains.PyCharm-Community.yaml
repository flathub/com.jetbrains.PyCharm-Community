app-id: com.jetbrains.PyCharm-Community
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pycharm
separate-locales: false
finish-args:
  - --device=all
  - --env=PATH=/app/bin:/app/extensions/bin:/usr/bin
  - --env=PYCHARM_JDK=${FLATPAK_DEST}/extra/jbr/
  - --filesystem=host
  - --filesystem=xdg-run/keyring
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=session-bus
  - --socket=ssh-auth
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.FileManager1
add-extensions:
  com.jetbrains.PyCharm.Extensions:
    directory: extensions
    version: '25.08'
    add-ld-path: lib
    merge-dirs: bin;lib
    subdirectories: true
    no-autodownload: true
modules:
  - python3-virtualenv.yaml

  - python3-pipenv.yaml

  - python3-poetry.yaml

  - name: pycharm
    buildsystem: simple
    build-commands:
      - install -D apply_extra /app/bin/apply_extra
      - install -D pycharm /app/bin/pycharm
      - install -D idea.properties ${FLATPAK_DEST}/idea.properties
      - install -Dm644 -t /app/share/metainfo com.jetbrains.PyCharm-Community.appdata.xml
      - install -Dm644 -t /app/share/applications com.jetbrains.PyCharm-Community.desktop
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps com.jetbrains.PyCharm-Community.svg
      - install -d "${FLATPAK_DEST}/extensions"
      - install -d "${FLATPAK_DEST}/packages"
    sources:
      - type: extra-data
        url: https://github.com/JetBrains/intellij-community/releases/download/pycharm%2F2026.3/pycharm-2026.3.tar.gz
        sha256: 5c26292b328e45a259a96e94f3b1c03fc78b78ab5c238a4c7f70114f493e8864
        size: 1281892617
        filename: pycharm-community.tar.gz
        only-arches: [x86_64]

      - type: extra-data
        url: https://github.com/JetBrains/intellij-community/releases/download/pycharm%2F2026.3/pycharm-2026.3-aarch64.tar.gz
        sha256: 46b8518432b7633237e7f864c2a11ca9b05cb16b10638cb70129f5001274954f
        size: 1304767052
        filename: pycharm-community.tar.gz
        only-arches: [aarch64]
      - type: file
        path: com.jetbrains.PyCharm-Community.appdata.xml
      - type: file
        path: com.jetbrains.PyCharm-Community.desktop
      - type: file
        path: com.jetbrains.PyCharm-Community.svg
      - type: file
        path: idea.properties
      - type: script
        dest-filename: apply_extra
        commands:
          - set -ex
          - echo
          - tar xf pycharm-community.tar.gz --strip-components 1
          - rm -f pycharm-community.tar.gz
          - cat /app/idea.properties | tee -a /app/extra/bin/idea.properties
          - python3 /app/extra/plugins/python-ce/helpers/pydev/setup_cython.py build_ext
            --inplace
      - type: script
        dest-filename: pycharm
        commands:
          - exec /app/extra/bin/pycharm "$@"